# Tag vX.Y.Z -> build, test, package the Windows installer (NSIS wizard with
# the EULA page) + portable ZIP, and attach both to the GitHub release. The
# in-app updater reads /releases/latest, so publishing the release is what
# makes wallets start offering the new version.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Check tag matches PROJECT_VERSION
        shell: bash
        run: |
          cmake_version=$(grep -oP 'project\(TackleBox VERSION \K[0-9.]+' CMakeLists.txt)
          tag=${GITHUB_REF_NAME#v}
          if [ "$cmake_version" != "$tag" ]; then
            echo "::error::tag v$tag != CMakeLists PROJECT_VERSION $cmake_version"
            exit 1
          fi
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Test
        shell: bash
        run: ./build/tacklebox_tests.exe
      # Optional Authenticode signing: set WINDOWS_CERT_PFX_B64 (base64 of a
      # .pfx) and WINDOWS_CERT_PASSWORD as repo secrets and both the app and
      # the installer get signed; without them the release ships unsigned.
      - name: Prepare signing certificate
        id: cert
        shell: bash
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
        run: |
          if [ -n "$PFX_B64" ]; then
            printf '%s' "$PFX_B64" | base64 -d > "$RUNNER_TEMP/signing.pfx"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing certificate configured - artifacts ship unsigned (SmartScreen will warn)."
          fi
      - name: Sign the application binary
        if: steps.cert.outputs.have == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match "x64" | Select-Object -Last 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\signing.pfx" /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\tacklebox.exe
      # windows-latest images no longer preinstall NSIS.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Package (NSIS installer + portable ZIP)
        shell: bash
        run: cd build && cpack -G "NSIS;ZIP"
      - name: Sign the installer
        if: steps.cert.outputs.have == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match "x64" | Select-Object -Last 1
          $installer = Get-ChildItem build\tacklebox-*-Windows.exe | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\signing.pfx" /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
      - name: Checksums
        shell: bash
        run: |
          cd build
          sha256sum tacklebox-*-Windows.exe tacklebox-*-Windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/tacklebox-*-Windows.exe
            build/tacklebox-*-Windows.zip
            build/SHA256SUMS.txt
