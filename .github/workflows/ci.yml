name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Test
        shell: bash
        run: ./build/tacklebox_tests.exe
      # The installer is built on every push so a template or packaging
      # fault shows up here, not in the release run.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Package (NSIS installer)
        shell: bash
        run: cd build && cpack -G NSIS
      - name: Check the installer
        shell: bash
        run: |
          set -e
          nsi=build/_CPack_Packages/win64/NSIS/project.nsi
          grep -q "TackleBox: vendored copy" "$nsi" || { echo "::error::the stock NSIS template was used (CPACK_MODULE_PATH lost): no per-user/upgrade fixes"; exit 1; }
          grep -q "^  RequestExecutionLevel user" "$nsi" || { echo "::error::installer would ask for elevation"; exit 1; }
          exe=$(ls build/tacklebox-*-Windows.exe)
          size=$(stat -c %s "$exe")
          echo "$exe: $size bytes"
          [ "$size" -gt 3000000 ] || { echo "::error::installer is too small to contain tacklebox.exe (the v0.3.0 hollow-installer fault)"; exit 1; }
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: tacklebox-windows-installer
          path: build/tacklebox-*-Windows.exe
          retention-days: 14

  linux:
    # The same image the release AppImage is built on (glibc 2.35 floor).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          # GCC 13 from Ubuntu's toolchain PPA: 22.04's GCC 12 rejects dwarfkit
          # (APIResponse::json "changes meaning", no -Wno-changes-meaning yet);
          # libstdc++ is linked statically, so the host needs nothing newer.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # No libcurl4-openssl-dev: 22.04's 7.81 lacks the WebSocket API, so
          # dwarfkit builds the libcurl pinned in CMakeLists.txt from source
          # against the image's OpenSSL and zlib.
          sudo apt-get install -y ninja-build g++-13 libssl-dev zlib1g-dev libgl1-mesa-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev \
            desktop-file-utils dpkg-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/tacklebox_tests
      - name: Package (tarball + deb)
        run: cd build && cpack -G "TGZ;DEB"
      - name: Package (AppImage)
        run: packaging/linux/appimage.sh build build
      - name: Check the packages
        run: |
          set -e
          ls -l build/tacklebox-*-Linux-*.tar.gz build/tacklebox_*.deb build/TackleBox-*.AppImage
          tar tzf build/tacklebox-*-Linux-*.tar.gz | grep -q "bin/tacklebox$" || { echo "::error::tarball has no binary"; exit 1; }
          dpkg-deb --info build/tacklebox_*.deb | grep -E "Package|Version|Depends"
          desktop-file-validate build/AppDir/usr/share/applications/tacklebox.desktop
          size=$(stat -c %s build/TackleBox-*.AppImage)
          [ "$size" -gt 4000000 ] || { echo "::error::AppImage is too small to hold the app"; exit 1; }
      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: tacklebox-linux-packages
          path: |
            build/tacklebox-*-Linux-*.tar.gz
            build/tacklebox_*.deb
            build/TackleBox-*.AppImage
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure (universal)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
      - name: Build
        run: cmake --build build
      - name: Test
        run: ./build/tacklebox_tests
      - name: Package (disk image)
        run: cd build && cpack -G DragNDrop
      - name: Check the bundle
        run: |
          set -e
          app=build/TackleBox.app
          test -x "$app/Contents/MacOS/TackleBox"
          lipo -archs "$app/Contents/MacOS/TackleBox"
          plutil -lint "$app/Contents/Info.plist"
          grep -q "tacklebox" "$app/Contents/Info.plist"
          ls -l build/tacklebox-*-macOS.dmg
      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: tacklebox-macos-dmg
          path: build/tacklebox-*-macOS.dmg
          retention-days: 14

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libcurl4-openssl-dev
      - name: Configure (fuzzers)
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTB_BUILD_FUZZERS=ON
      - name: Build fuzzers
        run: cmake --build build-fuzz --target fuzz_esr fuzz_network_json fuzz_sealed
      - name: Smoke-fuzz the attacker-facing parsers
        run: |
          for f in fuzz_esr fuzz_network_json fuzz_sealed; do
            echo "=== $f ==="
            ./build-fuzz/$f -max_total_time=25 -rss_limit_mb=2048 -print_final_stats=1
          done
