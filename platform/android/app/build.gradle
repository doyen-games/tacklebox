// TackleBox Android app module. The native side is the repo's root
// CMakeLists.txt (which builds SDL3, dwarfkit, curl+mbedTLS and the app as
// libmain.so); the Java side is SDL3's own activity classes, referenced
// straight out of vendor/sdl so nothing is copied.
apply plugin: 'com.android.application'

android {
    namespace 'io.tacklebox.wallet'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'io.tacklebox.wallet'
        minSdk 26          // SDL3 floor; also guarantees mlock/getentropy
        targetSdk 34
        versionCode 1
        versionName '0.2.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DTB_MOBILE=ON',
                          '-DTB_BUILD_TESTS=OFF'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.24.0+'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../../vendor/sdl/android-project/app/src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
